name: Deploy DanielTech to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6
      - name: Assemble static site and fetch the 3D model
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          mkdir -p _site/assets
          curl --fail --location --retry 3 --retry-all-errors --output _site/assets/MODEL2.glb 'https://github.com/JoseDanielAutomatiza/danieltech/releases/download/v1.0-modelo3d/MODEL2.glb'
          printf '%s  %s\n' '917ff14ad09246c89ad8f562a8d28eada083644993171159864d8a9c8a8bfce8' '_site/assets/MODEL2.glb' | sha256sum --check -
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
